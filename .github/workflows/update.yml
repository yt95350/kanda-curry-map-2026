name: 週1回の店舗情報更新

on:
  schedule:
    - cron: "0 21 * * 0"      # 毎週月曜 06:00 JST（UTCで日曜21:00）
  workflow_dispatch:           # 手動実行（Actions タブの「Run workflow」）

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - name: 公式サイトから取得して再生成
        run: OUT_DIR="$GITHUB_WORKSPACE" sh tools/update.sh
      - name: 変更があればコミットして公開
        run: |
          git config user.name "curry-map-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "店舗情報を更新（$(date -u +%Y-%m-%d)）"
            git push
          fi
